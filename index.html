<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>성경고사 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: one centered study card; slim progress bar on top; answer controls under the question */
:root{
  --bg:#eef2ee; --surface:#ffffff; --ink:#1b2826; --muted:#5d6c69; --line:#d5ddd8;
  --accent:#1f6a73; --accent-ink:#ffffff; --accent-soft:#dcebeb;
  --hl:#e9a91f; --hl-soft:#fdf1d6;
  --ok:#277a4a; --ok-bg:#e1f2e7; --bad:#b83a2c; --bad-bg:#fbe6e2;
  --quote:#f6f8f5;
  --f-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --scale:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#1a2321; --ink:#e4ebe8; --muted:#9aaba7; --line:#2d3a37;
  --accent:#5fb0b8; --accent-ink:#0d1716; --accent-soft:#1f3436;
  --hl:#e3ad3c; --hl-soft:#3a2f17;
  --ok:#72cf98; --ok-bg:#16301f; --bad:#ff8d7c; --bad-bg:#3a1c18; --quote:#151d1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#1a2321; --ink:#e4ebe8; --muted:#9aaba7; --line:#2d3a37;
  --accent:#5fb0b8; --accent-ink:#0d1716; --accent-soft:#1f3436;
  --hl:#e3ad3c; --hl-soft:#3a2f17;
  --ok:#72cf98; --ok-bg:#16301f; --bad:#ff8d7c; --bad-bg:#3a1c18; --quote:#151d1b; color-scheme:dark}
html{font-size:calc(17px * var(--scale))}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.7;margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.1rem;line-height:1.35;color:var(--accent);background:none;border:0;padding:0;letter-spacing:.01em;text-align:left;flex:1 1 14em;min-width:0;text-wrap:balance}
.stat{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;margin-left:auto;white-space:nowrap}
.fontctl{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.fontctl button{border:0;background:none;padding:4px 12px;font-family:var(--f-display);color:var(--ink);min-width:44px;min-height:36px}
.fontctl button+button{border-left:1px solid var(--line)}
.fontctl .s{font-size:.8rem}.fontctl .l{font-size:1.15rem}
.track{height:5px;background:var(--line)}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* start */
.hero{padding-block:40px 8px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:2.4rem;line-height:1.2;margin:0 0 8px;text-wrap:balance}
.hero p{color:var(--muted);margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:24px;display:grid;gap:20px}
.field{display:grid;gap:8px}
.field>label,.field>.lbl{font-family:var(--f-display);font-size:1.05rem}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 140px;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;line-height:1.35}
.seg button b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.1rem}
.seg button span{color:var(--muted);font-size:.85rem}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
select,.num{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}
.num{width:7em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.85rem}
.btn{border:0;border-radius:12px;padding:13px 22px;font-family:var(--f-display);font-size:1.1rem;background:var(--accent);color:var(--accent-ink);min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--hl-soft);border-radius:12px;padding:14px 16px}

/* question */
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:22px;color:var(--muted);font-size:.85rem}
.qno{font-family:var(--f-display);font-size:1.05rem;color:var(--ink)}
.tag{border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:.78rem;background:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:12px;display:grid;gap:16px;min-width:0}
.intro{color:var(--muted);font-size:.92rem}
.passage{background:var(--quote);border-left:4px solid var(--accent);border-radius:4px 10px 10px 4px;padding:12px 14px;white-space:pre-line;font-size:.95rem;max-height:16em;overflow:auto}
.bank{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bank .k{font-family:var(--f-display);color:var(--muted);font-size:.9rem;margin-right:2px}
.chip{background:var(--hl-soft);border-radius:8px;padding:2px 10px;font-size:.95rem;border:1.5px solid transparent}
.chip.tap{padding:5px 13px;min-height:40px;line-height:1.4}
.chip.tap:hover:not(:disabled){border-color:var(--hl)}
.chip.tap:active:not(:disabled){transform:translateY(1px)}
.chip.tap:disabled{cursor:default;opacity:.6}
.bank-tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;width:100%;margin-top:2px}
.hintrow{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.hintbtn{padding:6px 16px;min-height:40px;font-size:1rem;border-radius:999px}
.memhint{font-family:var(--f-display);color:var(--accent);font-size:1.1rem;overflow-wrap:anywhere}
.prompt{font-size:1.15rem;line-height:1.85;white-space:pre-line;overflow-wrap:anywhere}
.box{border:1px dashed var(--line);border-radius:10px;padding:14px 16px;white-space:pre-line;line-height:1.95;overflow-wrap:anywhere}
.blank{display:inline-block;vertical-align:baseline;border:0;border-bottom:2.5px solid var(--hl);background:var(--hl-soft);border-radius:6px 6px 0 0;padding:0 6px;margin:0 2px;text-align:center;min-width:3.2em;max-width:100%;font-size:1em;line-height:1.5}
.blank.ok{border-color:var(--ok);background:var(--ok-bg)}
.blank.bad{border-color:var(--bad);background:var(--bad-bg)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;line-height:1.55}
.opt .m{font-family:var(--f-display);color:var(--accent);min-width:1.4em}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox .opt{justify-content:center;font-family:var(--f-display);font-size:2.6rem;padding:14px;line-height:1}
.textans{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);resize:vertical}
textarea.textans{min-height:8em;line-height:1.7}
.order-items{display:grid;gap:8px}
.order-items .opt .m{font-size:1.1rem}
.order-items .opt.used{opacity:.4}
.seq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:44px}
.slot{font-family:var(--f-display);font-size:1.2rem;border:2px solid var(--line);border-radius:8px;min-width:2.2em;text-align:center;padding:2px 6px}
.slot.on{border-color:var(--accent);background:var(--accent-soft)}
.match{display:grid;gap:10px}
.match .mr{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:10px;align-items:center}
.match .mr b{font-weight:400;font-family:var(--f-display)}
.match select.ok{border-color:var(--ok);background:var(--ok-bg)}
.match select.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.fb.ok{background:var(--ok-bg)}.fb.bad{background:var(--bad-bg)}
.fb .v{font-family:var(--f-display);font-size:1.3rem}
.fb.ok .v{color:var(--ok)}.fb.bad .v{color:var(--bad)}
.fb .a{white-space:pre-line}
.fb .small{font-size:.85rem;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:.9rem;justify-self:start}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.actions .btn{flex:0 1 auto}
.kbd{color:var(--muted);font-size:.78rem;text-align:right;margin-top:6px}

/* finish */
.score{font-family:var(--f-display);font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1.4rem;color:var(--muted)}
.wrong{display:flex;flex-wrap:wrap;gap:6px}
.wrong span{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:2px 9px;font-variant-numeric:tabular-nums;font-size:.9rem}
@media (max-width:480px){
  .hero h1{font-size:2rem}.card{padding:16px}.prompt{font-size:1.08rem}
  .match .mr{grid-template-columns:1fr}
  .actions .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){.track i{transition:none}}
</style>

<header class="bar">
  <div class="bar-in">
    <button class="brand" id="home" type="button" title="처음 화면">경기중부노회 어린이 대회 성경고사(초등2부) 예제</button>
    <span class="stat" id="stat"></span>
    <div class="fontctl" role="group" aria-label="글씨 크기">
      <button type="button" class="s" id="fsm" aria-label="글씨 작게">가−</button>
      <button type="button" class="l" id="fsp" aria-label="글씨 크게">가+</button>
    </div>
  </div>
  <div class="track"><i id="trk"></i></div>
</header>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const TYPE = {fill:'빈칸 채우기', ox:'O / X', short:'단답형', memory:'암송', mc:'객관식', choice:'고르기', order:'순서 맞추기', match:'연결하기'};
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const byN = new Map(QS.map(q => [q.n, q]));
const UNITS = [...new Set(QS.map(q => q.u))];

/* font size */
let scale = store.get('bq-scale', 1);
const applyScale = () => { document.documentElement.style.setProperty('--scale', scale); store.set('bq-scale', scale); };
applyScale();
$('#fsm').onclick = () => { scale = Math.max(0.8, +(scale - 0.1).toFixed(2)); applyScale(); };
$('#fsp').onclick = () => { scale = Math.min(1.8, +(scale + 0.1).toFixed(2)); applyScale(); };

/* helpers */
const norm = s => String(s).normalize('NFC').replace(/[\s.,!?·“”‘’"'()\[\]{}~\-–—:;…<>/]/g, '').toLowerCase();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function similarity(a, b){
  a = norm(a); b = norm(b);
  if (!a.length || !b.length) return 0;
  const m = a.length, n = b.length; let prev = new Array(n + 1).fill(0);
  for (let i = 1; i <= m; i++){ const cur = [0]; for (let j = 1; j <= n; j++) cur[j] = a[i-1] === b[j-1] ? prev[j-1] + 1 : Math.max(prev[j], cur[j-1]); prev = cur; }
  return 2 * prev[n] / (m + n);
}

/* session */
let S = null; // {deck:[n], pos, res:{n:true/false}, mode, unit}
const save = () => S && store.set('bq-session', S);

function setBar(){
  const trk = $('#trk'), st = $('#stat');
  if (!S || S.done){ trk.style.width = S && S.done ? '100%' : '0'; st.textContent = S && S.done ? '' : `전체 ${QS.length}문항`; return; }
  const total = S.deck.length, answered = Object.keys(S.res).length;
  const ok = Object.values(S.res).filter(Boolean).length;
  trk.style.width = (100 * S.pos / total) + '%';
  st.textContent = `${S.pos + 1} / ${total} · 맞힘 ${ok}/${answered}`;
}

/* ---------- start screen ---------- */
let opt = store.get('bq-opt', {mode:'seq', unit:'all', from:1});
function startScreen(){
  const saved = store.get('bq-session', null);
  const resumable = saved && !saved.done && saved.deck && saved.pos < saved.deck.length;
  S = null; setBar();
  view.innerHTML = `
  <section class="hero">
    <h1>성경고사 연습</h1>
    <p>${QS.length}문항 · 한 문제씩 풀고 바로 정답을 확인해요.</p>
  </section>
  ${resumable ? `<div class="resume" style="margin-top:20px"><span>풀던 문제가 있어요 · <b>${saved.pos + 1} / ${saved.deck.length}</b> (${saved.mode === 'rand' ? '무작위' : '차례대로'})</span><button class="btn" id="resume" type="button">이어서 풀기</button></div>` : ''}
  <form class="panel" id="setup">
    <div class="field"><span class="lbl">문제 순서</span>
      <div class="seg" role="group">
        <button type="button" data-mode="seq" aria-pressed="${opt.mode === 'seq'}"><b>차례대로</b><span>1번부터 순서대로</span></button>
        <button type="button" data-mode="rand" aria-pressed="${opt.mode === 'rand'}"><b>무작위</b><span>순서를 섞어서</span></button>
      </div>
    </div>
    <div class="field"><label for="unit">범위</label>
      <select id="unit">
        <option value="all">전체 (${QS.length}문항)</option>
        ${UNITS.map(u => `<option value="${esc(u)}" ${opt.unit === u ? 'selected' : ''}>${esc(u)} (${QS.filter(q => q.u === u).length}문항)</option>`).join('')}
      </select>
    </div>
    <div class="field" id="fromf" ${opt.mode === 'rand' ? 'hidden' : ''}><label for="from">시작 번호</label>
      <div class="row"><input class="num" id="from" type="number" min="1" max="${QS.length}" value="${opt.from || 1}" inputmode="numeric"><span class="hint">이 번호부터 시작해요. 범위 안의 번호만 나와요.</span></div>
    </div>
    <button class="btn wide" type="submit" id="go">시작하기</button>
  </form>`;
  if (opt.unit !== 'all') $('#unit').value = opt.unit;
  view.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    opt.mode = b.dataset.mode;
    view.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
    $('#fromf').hidden = opt.mode === 'rand';
  });
  if (resumable) $('#resume').onclick = () => { S = saved; showQ(); };
  $('#setup').onsubmit = e => {
    e.preventDefault();
    opt.unit = $('#unit').value; opt.from = Math.max(1, parseInt($('#from').value, 10) || 1);
    store.set('bq-opt', opt);
    let list = QS.filter(q => opt.unit === 'all' || q.u === opt.unit).map(q => q.n);
    if (opt.mode === 'rand') list = shuffle(list);
    else { const f = list.filter(n => n >= opt.from); list = f.length ? f : list; }
    S = {deck:list, pos:0, res:{}, mode:opt.mode, unit:opt.unit};
    save(); showQ();
  };
}

/* ---------- question ---------- */
let cur = null; // {q, checked, check(), ...}
function renderText(text){
  return esc(text).replace(/\(\u0002\)/g, () => {
    const k = cur.blankIdx++;
    const a = (cur.q.ans || [])[k] || '';
    const w = Math.max(3.2, Math.min(14, [...a].length * 1.15 + 1.6));
    return `(<input class="blank" data-b="${k}" aria-label="빈칸 ${k + 1}" autocomplete="off" style="width:${w}em">)`;
  });
}

function showQ(){
  if (!S) return startScreen();
  if (S.pos >= S.deck.length) return finish();
  const q = byN.get(S.deck[S.pos]);
  cur = {q, checked:false, blankIdx:0};
  setBar();
  let body = '';
  const intro = q.intro || [];
  if (intro[0]) body += `<div class="intro">${esc(intro[0])}</div>`;
  if (intro[1]) body += `<div class="passage">${esc(intro[1])}</div>`;
  let words = null, qtext = q.q;
  if (q.bank) words = q.bank.replace(/^(힌트\)|보기\)|<보기>)\s*/, '').split(/\s*,\s*/);
  const inl = /\s*[(<]보기\s*:\s*([^)>]+)[)>]/, mm = qtext.match(inl);
  if (mm){ words = mm[1].split(/\s*,\s*/); qtext = qtext.replace(inl, ''); }
  const tappable = !!words && (q.t === 'fill' || q.t === 'short');
  if (words){
    body += `<div class="bank"><span class="k">보기</span>${words.map(w => tappable
      ? `<button type="button" class="chip tap" data-w="${esc(w)}">${esc(w)}</button>`
      : `<span class="chip">${esc(w)}</span>`).join('')}
      ${tappable ? `<div class="bank-tools"><span class="hint">${q.t === 'fill' ? '낱말을 누르면 빈칸이 앞에서부터 차례로 채워져요.' : '낱말을 누르면 답 칸에 들어가요.'}</span><button type="button" class="linkbtn" id="undo1">하나 지우기</button></div>` : ''}</div>`;
  }
  body += `<div class="prompt">${renderText(qtext)}</div>`;
  if (q.box) body += `<div class="box">${renderText(q.box)}</div>`;
  body += `<div id="ans"></div><div id="fb"></div>`;
  view.innerHTML = `
    <div class="meta"><span class="qno">${q.n}번</span><span class="tag">${TYPE[q.t]}</span><span>${esc(q.u || '')} · ${esc(q.l || '')}</span></div>
    <article class="card">${body}</article>
    <div class="actions" id="acts"></div>
    <div class="kbd" id="kbd"></div>`;
  const ans = $('#ans');
  const T = q.t;
  if (T === 'mc' || T === 'choice'){
    ans.innerHTML = `<div class="opts">${q.opts.map((o, i) => `<button type="button" class="opt" data-i="${i}"><span class="m">${CIRC[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
    ans.querySelectorAll('.opt').forEach(b => b.onclick = () => judgeChoice(+b.dataset.i));
  } else if (T === 'ox'){
    ans.innerHTML = `<div class="ox"><button type="button" class="opt" data-v="O" aria-label="O 맞아요">O</button><button type="button" class="opt" data-v="X" aria-label="X 틀려요">X</button></div>`;
    ans.querySelectorAll('.opt').forEach(b => b.onclick = () => judgeOX(b.dataset.v));
  } else if (T === 'short'){
    ans.innerHTML = `<input class="textans" id="ta" placeholder="답을 적어 보세요" autocomplete="off">`;
  } else if (T === 'memory'){
    ans.innerHTML = `<div class="hintrow"><button type="button" class="btn ghost hintbtn" id="hint">힌트</button><span class="memhint" id="mh"></span></div><textarea class="textans" id="ta" placeholder="말씀을 외워서 적어 보세요"></textarea>`;
    const mw = q.ans.split(/\s+/); cur.hintN = 0;
    $('#hint').onclick = () => {
      if (cur.checked) return;
      if (cur.hintN < mw.length) cur.hintN++;
      $('#mh').textContent = mw.slice(0, cur.hintN).join(' ') + (cur.hintN < mw.length ? ' …' : '');
      $('#hint').textContent = cur.hintN < mw.length ? '한 단어 더' : '힌트 끝';
      if (cur.hintN >= mw.length) $('#hint').disabled = true;
    };
  } else if (T === 'order'){
    cur.seq = [];
    ans.innerHTML = `<div class="order-items">${q.items.map(([k, v]) => `<button type="button" class="opt" data-k="${k}"><span class="m">${k}</span><span>${esc(v)}</span></button>`).join('')}</div>
      <div class="row" style="margin-top:12px"><div class="seq" id="seq"></div><button type="button" class="linkbtn" id="undo">하나 지우기</button></div>
      <div class="hint">먼저 일어난 일부터 차례로 누르세요.</div>`;
    const draw = () => {
      $('#seq').innerHTML = q.items.map((_, i) => `<span class="slot ${cur.seq[i] ? 'on' : ''}">${cur.seq[i] || '&nbsp;'}</span>`).join('<span aria-hidden="true">–</span>');
      ans.querySelectorAll('.order-items .opt').forEach(b => { const u = cur.seq.includes(b.dataset.k); b.classList.toggle('used', u); b.disabled = u || cur.checked; });
    };
    ans.querySelectorAll('.order-items .opt').forEach(b => b.onclick = () => { if (cur.checked) return; cur.seq.push(b.dataset.k); draw(); });
    $('#undo').onclick = () => { if (cur.checked) return; cur.seq.pop(); draw(); };
    cur.draw = draw; draw();
  } else if (T === 'match'){
    cur.perm = shuffle(q.right.map((_, i) => i));
    ans.innerHTML = `<div class="match">${q.left.map((l, i) => `<div class="mr"><b>${esc(l)}</b><select data-r="${i}" aria-label="${esc(l)}"><option value="">고르세요</option>${cur.perm.map(j => `<option value="${j}">${esc(q.right[j])}</option>`).join('')}</select></div>`).join('')}</div>`;
  }
  if (tappable){
    cur.stack = []; cur.lastBlank = null;
    view.querySelectorAll('.blank').forEach(el => el.addEventListener('focus', () => { cur.lastBlank = el; }));
    view.querySelectorAll('.chip.tap').forEach(c => c.onclick = () => {
      if (cur.checked) return;
      const w = c.dataset.w;
      if (T === 'short'){ $('#ta').value = w; cur.stack = [$('#ta')]; return; }
      const bl = [...view.querySelectorAll('.blank')];
      const t = (cur.lastBlank && !cur.lastBlank.value) ? cur.lastBlank : bl.find(b => !b.value);
      cur.lastBlank = null;
      if (!t) return;
      t.value = w; cur.stack.push(t);
    });
    $('#undo1').onclick = () => {
      if (cur.checked) return;
      let t = cur.stack.pop();
      if (!t){ const bl = [...view.querySelectorAll('.blank, #ta')].filter(b => b.value); t = bl[bl.length - 1]; }
      if (t) t.value = '';
    };
  }
  const needsBtn = !(T === 'mc' || T === 'choice' || T === 'ox');
  $('#acts').innerHTML = `<button type="button" class="btn ghost" id="skip">건너뛰기</button>${needsBtn ? '<button type="button" class="btn" id="check">정답 확인</button>' : ''}`;
  $('#kbd').textContent = needsBtn ? (T === 'memory' ? 'Ctrl + Enter: 정답 확인' : 'Enter: 정답 확인') : '';
  $('#skip').onclick = () => next(false, true);
  if (needsBtn) $('#check').onclick = judgeText;
  const first = view.querySelector('.blank, #ta');
  if (first && matchMedia('(hover:hover)').matches) first.focus({preventScroll:true});
  window.scrollTo({top:0});
}

function record(ok){ S.res[cur.q.n] = ok; save(); setBar(); }

function feedback(ok, answerHtml, extra = '', overridable = false){
  cur.checked = true;
  record(ok);
  $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}" role="status">
    <div class="v">${ok ? '정답이에요!' : '아쉬워요'}</div>
    ${answerHtml ? `<div class="a">${answerHtml}</div>` : ''}
    ${extra}
    ${overridable && !ok ? '<button type="button" class="linkbtn" id="ovr">내 답도 맞아요 (정답으로 처리)</button>' : ''}
  </div>`;
  if (overridable && !ok) $('#ovr').onclick = () => { record(true); const f = $('#fb .fb'); f.className = 'fb ok'; $('#fb .v').textContent = '정답으로 처리했어요'; $('#ovr').remove(); };
  view.querySelectorAll('.blank, #ta').forEach(el => el.readOnly = true);
  view.querySelectorAll('.opt, .chip.tap, #hint').forEach(b => b.disabled = true);
  $('#acts').innerHTML = `<button type="button" class="btn" id="next">${S.pos + 1 >= S.deck.length ? '결과 보기' : '다음 문제 →'}</button>`;
  $('#kbd').textContent = 'Enter: 다음 문제';
  $('#next').onclick = () => next();
  $('#next').focus({preventScroll:true});
  $('#fb').scrollIntoView({block:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}

function judgeChoice(i){
  if (cur.checked) return;
  const q = cur.q, ok = i === q.ans;
  view.querySelectorAll('.opt').forEach((b, j) => { if (j === q.ans) b.classList.add('ok'); else if (j === i) b.classList.add('bad'); });
  feedback(ok, ok ? '' : `정답: ${q.t === 'mc' ? CIRC[q.ans] + ' ' : ''}${esc(q.opts[q.ans])}`);
}
function judgeOX(v){
  if (cur.checked) return;
  const q = cur.q, ok = v === q.ans;
  view.querySelectorAll('.opt').forEach(b => { if (b.dataset.v === q.ans) b.classList.add('ok'); else if (b.dataset.v === v) b.classList.add('bad'); });
  const note = q.note ? `<div class="small">바르게 고치면: ${esc(q.note)}</div>` : '';
  feedback(ok, ok ? '' : `정답: ${q.ans}`, note);
}
function judgeText(){
  if (cur.checked) return;
  const q = cur.q, T = q.t;
  if (T === 'fill'){
    const ins = [...view.querySelectorAll('.blank')];
    let all = true;
    ins.forEach(el => {
      const k = +el.dataset.b, a = q.ans[k], alts = [a, ...((q.alt || {})[k] || [])];
      const ok = alts.some(x => norm(x) === norm(el.value));
      el.classList.add(ok ? 'ok' : 'bad'); if (!ok) all = false;
    });
    feedback(all, all ? '' : `정답: ${q.ans.map(esc).join(', ')}`, '', true);
  } else if (T === 'short'){
    const v = $('#ta').value, a = q.ans;
    let ok = norm(v) === norm(a);
    if (!ok && /,/.test(a)){ const A = a.split(',').map(norm).sort().join('|'), V = v.split(/[,\s]+/).map(norm).filter(Boolean).sort().join('|'); ok = A === V; }
    feedback(ok, ok ? '' : `정답: ${esc(a)}`, '', true);
  } else if (T === 'memory'){
    const v = $('#ta').value, r = similarity(v, q.ans), ok = r >= 0.97;
    feedback(ok, esc(q.ans), v.trim() ? `<div class="small">내가 쓴 말씀과 ${Math.round(r * 100)}% 같아요.</div>` : '', true);
  } else if (T === 'order'){
    if (cur.seq.length < q.items.length){ $('#fb').innerHTML = `<div class="hint">${q.items.length}개를 모두 골라 주세요.</div>`; return; }
    const ok = cur.seq.join('') === q.ans.join('');
    feedback(ok, `정답: ${q.ans.join(' – ')}`);
    cur.draw && cur.draw();
  } else if (T === 'match'){
    const sels = [...view.querySelectorAll('.match select')];
    if (sels.some(s => s.value === '')){ $('#fb').innerHTML = `<div class="hint">모두 연결해 주세요.</div>`; return; }
    let all = true;
    sels.forEach(s => { const i = +s.dataset.r, ok = +s.value === q.ans[i]; s.classList.add(ok ? 'ok' : 'bad'); if (!ok) all = false; });
    feedback(all, all ? '' : q.left.map((l, i) => `${esc(l)} → ${esc(q.right[q.ans[i]])}`).join('\n'));
    sels.forEach(s => s.disabled = true);
  }
}
function next(ok, skipped){
  if (skipped && !cur.checked) { S.res[cur.q.n] = false; }
  S.pos++; save(); showQ();
}

/* ---------- finish ---------- */
function finish(){
  S.done = true; save(); setBar();
  const total = S.deck.length, ok = S.deck.filter(n => S.res[n]).length;
  const wrong = S.deck.filter(n => !S.res[n]);
  view.innerHTML = `
  <section class="hero"><h1>다 풀었어요</h1><p>${S.mode === 'rand' ? '무작위' : '차례대로'} · ${S.unit === 'all' ? '전체' : esc(S.unit)}</p></section>
  <div class="panel">
    <div class="score">${ok}<small> / ${total}</small></div>
    <div>${Math.round(100 * ok / total)}% 맞혔어요.</div>
    ${wrong.length ? `<div class="field"><span class="lbl">틀리거나 건너뛴 문제 ${wrong.length}개</span><div class="wrong">${wrong.slice().sort((a, b) => a - b).map(n => `<span>${n}</span>`).join('')}</div></div>` : ''}
    <div class="row">
      ${wrong.length ? '<button type="button" class="btn" id="retry">틀린 문제만 다시 풀기</button>' : ''}
      <button type="button" class="btn ghost" id="again">처음으로</button>
    </div>
  </div>`;
  if (wrong.length) $('#retry').onclick = () => { S = {deck: S.mode === 'rand' ? shuffle(wrong) : wrong.slice().sort((a, b) => a - b), pos:0, res:{}, mode:S.mode, unit:S.unit}; save(); showQ(); };
  $('#again').onclick = () => { store.del('bq-session'); startScreen(); };
}

/* keyboard */
document.addEventListener('keydown', e => {
  if (!cur || !S || S.done || !view.querySelector('#acts')) return;
  if (e.key !== 'Enter') return;
  const inTA = e.target.tagName === 'TEXTAREA';
  if (inTA && !(e.ctrlKey || e.metaKey)) return;
  if (e.target.tagName === 'BUTTON' && !inTA) return; // native click
  if (e.isComposing) return;
  e.preventDefault();
  if (cur.checked) next();
  else if ($('#check')) judgeText();
});

$('#home').onclick = () => startScreen();
startScreen();
})();
</script>

</body></html>
